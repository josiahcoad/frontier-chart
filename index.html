<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Cost versus intelligence for the 100 highest-scoring models on OpenRouter, refreshed hourly.">
<style>
  /* The artifact host used to supply these; a standalone page has to set its own baseline. */
  *{box-sizing:border-box}
  body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;background:#f9f9f7;color:#0b0b0b}
  @media (prefers-color-scheme: dark){body{background:#0d0d0d;color:#fff}}
  img{max-width:100%}
</style>
<title>LLM Cost vs Intelligence — Top 100 on OpenRouter</title>
<style>
.viz-root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --series-1:#2a78d6; --series-2:#eb6834; --frontier:#2a78d6;
  /* Throughput ramp: red = slow, amber = middling, green = fast. Held to three steps —
     a five-step red-to-green has adjacent pairs only 2 dE apart, which nobody can read.
     Red vs green is the pair colorblind readers lose, so the number is also in the
     tooltip and the table view. */
  --tps-1:#d03b3b; --tps-2:#eda100; --tps-3:#008300;
  --tps-na:#898781;
}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])) .viz-root{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d;
  --text-primary:#fff; --text-secondary:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --series-1:#3987e5; --series-2:#d95926; --frontier:#3987e5;
  --tps-1:#e06767; --tps-2:#d9a015; --tps-3:#3aa83a;
  --tps-na:#898781;
}}
:root[data-theme="dark"] .viz-root{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d;
  --text-primary:#fff; --text-secondary:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --series-1:#3987e5; --series-2:#d95926; --frontier:#3987e5;
  --tps-1:#e06767; --tps-2:#d9a015; --tps-3:#3aa83a;
  --tps-na:#898781;
}
body{margin:0;background:var(--plane,#f9f9f7)}
.viz-root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--plane);
  color:var(--text-primary);padding:28px 20px 48px;min-height:100vh;box-sizing:border-box}
.wrap{max-width:1020px;margin:0 auto}
h1{font-size:22px;line-height:1.25;margin:0 0 8px;font-weight:650}
.note{font-size:12.5px;line-height:1.55;color:var(--text-secondary);margin:0 0 16px;max-width:76ch}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:14px 14px 10px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px;padding:0 4px}
select,button,input{font:inherit;font-size:13px;color:var(--text-primary);background:var(--surface-1);
  border:1px solid var(--border);border-radius:8px;padding:6px 10px}
select,button{cursor:pointer}
button.on{background:var(--frontier);border-color:var(--frontier);color:#fff}
input{min-width:190px}
input:focus{outline:2px solid var(--series-1);outline-offset:-1px}
.count{font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;background:var(--frontier);
  color:#fff;border-radius:999px;padding:3px 5px 3px 10px}
.chip button{all:unset;cursor:pointer;line-height:1;padding:1px 5px;border-radius:999px;opacity:.75}
.chip button:hover,.chip button:focus-visible{opacity:1;background:rgba(255,255,255,.28)}
.timeline{gap:12px;margin-bottom:14px}
.timeline input[type=range]{flex:1;min-width:220px;max-width:520px;padding:0;accent-color:var(--frontier);cursor:pointer}
#play{min-width:82px}
.asof{font-size:13px;color:var(--text-secondary);font-variant-numeric:tabular-nums;min-width:9ch}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--text-secondary);
  margin:2px 4px 6px;align-items:center}
.legend svg{vertical-align:-3px;margin-right:5px}
.plotwrap{position:relative}
.plot{overflow-x:auto}
svg.chart{display:block;min-width:680px;width:100%;height:auto}
/* On a narrow screen the chart is wider than the card and scrolls sideways, taking the
   y-axis with it — the dots then have no scale to read against. This pane holds a second
   copy of the axis, pinned outside the scroller so it stays put. It sits directly on top
   of the real axis at scroll 0, so nothing looks doubled. */
.yaxis{position:absolute;left:0;top:0;overflow:hidden;pointer-events:none;
  background:var(--surface-1);transition:box-shadow .15s}
.yaxis.floating{box-shadow:6px 0 8px -6px rgba(0,0,0,.28)}
.yaxis svg{display:block}
.tick{font-size:11px;fill:var(--muted)}
.axlabel{font-size:12px;fill:var(--text-secondary)}
.ghostlabel{font-size:10px;fill:var(--muted);
  paint-order:stroke;stroke:var(--surface-1);stroke-width:3px;stroke-linejoin:round}
.dotlabel{font-size:10.5px;fill:var(--text-secondary);
  paint-order:stroke;stroke:var(--surface-1);stroke-width:3px;stroke-linejoin:round}
.tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;background:var(--surface-1);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;
  box-shadow:0 6px 20px rgba(0,0,0,.14);max-width:280px;z-index:9;line-height:1.5}
.tip b{display:block;font-size:13px;margin-bottom:3px}
.tip span{color:var(--text-secondary)}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--grid)}
th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
th{color:var(--text-secondary);font-weight:600;cursor:pointer;user-select:none;
  white-space:nowrap;position:sticky;top:0;background:var(--surface-1)}
th:hover{color:var(--text-primary)}
th:focus-visible{outline:2px solid var(--series-1);outline-offset:-2px}
th.sorted{color:var(--text-primary)}
.arrow{display:inline-block;width:1em;color:var(--frontier)}
/* Every sortable header carries a faint ↕ so the whole row reads as clickable.
   Without it only the active column showed a mark and the other nine looked inert. */
.arrow.idle{color:var(--muted);opacity:.32}
th:hover .arrow.idle{opacity:.85}
.tcap{font-size:12.5px;color:var(--text-secondary);margin:0 4px 8px}
.tcap b{color:var(--text-primary)}
.hide{display:none}
.statusmsg{font-size:13px;fill:var(--text-secondary)}
.foot{font-size:12px;color:var(--muted);margin:14px 4px 0}
.foot a{color:inherit}
.empty{padding:40px 8px;text-align:center;color:var(--text-secondary);font-size:13.5px}
.nomatch{text-align:center;color:var(--text-secondary);font-size:13px;padding:2px 8px 8px}
</style>

</head>
<body>
<div class="viz-root"><div class="wrap">
<h1>Cost vs. intelligence — the 100 smartest models</h1>


<div class="bar">
  <input id="q" type="search" placeholder="Add a term, press Enter: luna, glm…" autocomplete="off"
    aria-label="Filter models by name — press Enter to add another term">
  <span id="chips" class="chips"></span>
  <select id="prov"><option value="">All providers</option></select>
  <select id="oss" aria-label="Filter by open or closed weights">
    <option value="">Open + closed weights</option>
    <option value="1">Open weights only</option>
    <option value="0">Closed weights only</option>
  </select>
  <select id="metric">
    <option value="i">Intelligence index</option>
    <option value="c">Coding index</option>
    <option value="a">Agentic index</option>
  </select>
  <button id="toggle">Show table</button>
  <button id="mode" aria-pressed="false">✏️ Lasso select</button>
  <button id="clear" class="hide">Clear selection</button>
  <span class="count" id="count"></span>
</div>

<div class="bar timeline">
  <button id="play" aria-label="Play the frontier forward">▶ Play</button>
  <input id="asof" type="range" min="0" max="0" value="0" step="1" aria-label="Show models listed up to this month">
  <span class="asof" id="asofLabel"></span>
</div>

<div class="card">
  <div class="legend">
    <span><svg width="26" height="13"><line x1="1" y1="6.5" x2="25" y2="6.5" stroke="var(--frontier)" stroke-width="2"/></svg>Value frontier</span>
    <span><svg width="26" height="13"><line x1="1" y1="6.5" x2="25" y2="6.5" stroke="var(--frontier)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/></svg>Previous frontiers</span>
    <span><svg width="13" height="13"><path d="M2.5 2.5L10.5 10.5M10.5 2.5L2.5 10.5" stroke="var(--tps-3)" stroke-width="2.2" stroke-linecap="round"/></svg>Text only (no vision)</span>
    <span><svg width="46" height="14"><circle cx="6" cy="7" r="4" fill="var(--muted)"/><circle cx="20" cy="7" r="6" fill="var(--muted)"/><circle cx="37" cy="7" r="8.5" fill="var(--muted)"/></svg>Slower first token &rarr;</span>
    <span><svg width="48" height="13"><circle cx="6" cy="6.5" r="5" fill="var(--tps-1)"/><circle cx="21" cy="6.5" r="5" fill="var(--tps-2)"/><circle cx="36" cy="6.5" r="5" fill="var(--tps-3)"/></svg>tokens per second (slow &rarr; fast)</span>
  </div>
  <div class="plotwrap"><div class="plot" id="plot"></div><div class="yaxis" id="yaxis" aria-hidden="true"></div></div>
  <div id="tablewrap" class="hide" style="padding:6px 4px 12px"></div>
</div>
<p class="foot">Data via <a href="https://openrouter.ai/">OpenRouter</a> · scores by
<a href="https://artificialanalysis.ai/">Artificial Analysis</a> · <span id="freshness">loading…</span></p>
</div>
<div class="tip" id="tip"></div>
</div>

<script>
// The edge function is the single source of truth. There is deliberately no snapshot
// inlined here: Vercel's stale-while-revalidate window already serves the last good payload
// for 24h if OpenRouter goes down, so a second copy would add ~30KB and a second thing to
// drift, to cover only the narrow case where the HTML serves but the function does not.
let MODELS = [];
// Non-null while the chart has nothing to draw; rendered in the middle of the empty plot.
let statusMsg = null;
const W=980,H=580,M={t:22,r:26,b:56,l:60};
const FREE_X=0.028, XMIN=0.022, XMAX=34;
const lx=v=>Math.log10(Math.max(v,FREE_X));
const $=s=>document.querySelector(s);

function initProviders(){
  const keep=$('#prov').value;
  const provs=[...new Set(MODELS.map(m=>m.prov))].sort();
  $('#prov').innerHTML='<option value="">All providers</option>'
    +provs.map(p=>`<option>${p}</option>`).join('');
  // A provider that survived the refresh keeps its selection; one that vanished falls back
  // to "All" rather than leaving the dropdown pointing at something that no longer exists.
  if(provs.includes(keep)) $('#prov').value=keep;
}

// Marker size = time to first token. Log-scaled: latency spans 137ms to 4.2s,
// so a linear radius would make everything below 1s indistinguishable.
const LAT_LO=150, LAT_HI=4500;
const rOf=m=>{
  if(m.lat==null) return 4;
  const t=(Math.log10(Math.min(Math.max(m.lat,LAT_LO),LAT_HI))-Math.log10(LAT_LO))/(Math.log10(LAT_HI)-Math.log10(LAT_LO));
  return 4+t*7;
};
const shortName=n=>n.replace(/^[^:]+:\s*/,'');

// Throughput gets the color channel as a 5-step ordinal ramp. Buckets are cut near the
// quartiles of the real distribution (8 to 504 tok/s) so each step holds a real share.
const TPS_STOPS=[50,120];
const tpsStep=m=>m.tps==null?0:TPS_STOPS.filter(s=>m.tps>=s).length+1;
const tpsFill=m=>m.tps==null?'var(--tps-na)':`var(--tps-${tpsStep(m)})`;

const MONTH_NAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// The timeline is built from each model's OpenRouter listing date (the `created` field —
// the closest thing to a release date the API gives us) and is cumulative: each stop shows
// everything listed UP TO it, which is what makes the frontier visibly march outward.
//
// Resolution is deliberately mixed. A month per stop is right for 2025, but releases now
// land days apart — DeepSeek V4 Flash 0731 took a chunk out of the middle of the frontier
// roughly 32 hours after listing — and a monthly step drops that whole story into one
// frame. So the recent window steps by week and everything older stays monthly.
const WEEKLY_WINDOW_DAYS = 56;
const DAY = 86400;

let STOPS=[];
function buildStops(){
  const ts=MODELS.map(m=>m.t).filter(Boolean);
  if(!ts.length) return [];
  const first=new Date(Math.min(...ts)*1000), last=Math.max(...ts);
  const weeklyFrom = last - WEEKLY_WINDOW_DAYS*DAY;
  const out=[];

  for(let y=first.getUTCFullYear(), mo=first.getUTCMonth();;){
    const end=Date.UTC(y,mo+1,1)/1000;
    if(end>weeklyFrom) break;
    out.push({end, label:`${MONTH_NAMES[mo]} ${y}`, short:`${MONTH_NAMES[mo]} ${String(y).slice(2)}`});
    if(++mo>11){mo=0;y++;}
  }

  // Weekly stops carry on from wherever the monthly ones stopped, through the newest
  // listing. The last stop is clamped to just past it so "now" is always reachable.
  let t = out.length ? out[out.length-1].end : Math.min(...ts);
  while(t <= last){
    t = Math.min(t + 7*DAY, last + 1);
    const d = new Date((t-1)*1000);   // label the last day the stop includes, not the boundary
    out.push({
      end: t,
      label: `${d.getUTCDate()} ${MONTH_NAMES[d.getUTCMonth()]} ${d.getUTCFullYear()}`,
      short: `${d.getUTCDate()} ${MONTH_NAMES[d.getUTCMonth()]}`,
      week: true,
    });
  }
  return out;
}

function initStops(){
  const wasAtEnd = !STOPS.length || +$('#asof').value===STOPS.length-1;
  STOPS=buildStops();
  $('#asof').max=STOPS.length-1;
  // Live data can add a stop on the end. Someone parked at "now" should stay at "now";
  // someone who rewound deliberately should not be yanked forward.
  if(wasAtEnd) $('#asof').value=STOPS.length-1;
}
const cutoff=()=>STOPS[+$('#asof').value]?.end ?? Infinity;

// Drag-select: a box drawn on the plot acts exactly like the text filter — everything
// inside stays lit and labelled, everything else dims. Kept in viewBox units so it
// survives the chart being re-rendered at a different pixel size.
let brush=null;       // committed lasso polygon [[x,y],…], in viewBox units
let selecting=false;  // is drag-to-select armed?

// Standard ray-casting: count how many polygon edges a ray to the right crosses.
// Odd means inside. Handles the concave shapes a freehand lasso produces.
function inBrush(x,y){
  if(!brush) return false;
  let inside=false;
  for(let i=0,j=brush.length-1;i<brush.length;j=i++){
    const [xi,yi]=brush[i], [xj,yj]=brush[j];
    if((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
  }
  return inside;
}

const lassoPath=pts=>'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+'Z';

function pareto(rows,key){
  rows.forEach(r=>r._p=false);
  rows.forEach(r=>{
    if(r[key]==null) return;
    r._p=!rows.some(o=>o[key]!=null&&o.b<=r.b&&o[key]>=r[key]&&(o.b<r.b||o[key]>r[key]));
  });
  return rows.filter(r=>r._p).sort((a,b)=>a.b-b.b);
}


// Search terms are OR'd, so "luna" + "glm" shows both — the point is comparing a handful
// of models or providers side by side, not narrowing to one. Enter or comma commits the
// typed text as a chip; Backspace on an empty box removes the last chip. Terms match the
// model id too, so a bare provider name like "anthropic" works as a term.
let terms=[];
// Whatever is half-typed counts as a term as well, so results move as you type instead of
// only after you commit.
function activeTerms(){
  const typing=$('#q').value.trim().toLowerCase();
  return typing && !terms.includes(typing) ? terms.concat(typing) : terms.slice();
}
function addTerm(){
  const v=$('#q').value.trim().toLowerCase();
  if(v && !terms.includes(v)) terms.push(v);
  $('#q').value='';
  render();
}
// Clicking a model — a dot on the chart or its name in the table — adds it to the search
// filter. Uses the short name so the chip reads "claude opus 5" rather than the id-prefixed
// "anthropic: claude opus 5"; both still match, since terms test name and id alike.
function termFor(m){ return shortName(m.name).toLowerCase(); }
function toggleTermForModel(id){
  const m=MODELS.find(x=>x.id===id);
  if(!m) return;
  const t=termFor(m), i=terms.indexOf(t);
  // Clicking a model that is already picked removes it, so the same click builds and
  // unbuilds a comparison set without reaching for the chip's ×.
  if(i>=0) terms.splice(i,1); else terms.push(t);
  $('#q').value='';
  render();
}

function renderChips(){
  $('#chips').innerHTML=terms.map((t,i)=>
    `<span class="chip">${t}<button data-i="${i}" aria-label="Remove filter ${t}">&times;</button></span>`).join('');
  $('#chips').querySelectorAll('button').forEach(b=>{
    b.onclick=()=>{ terms.splice(+b.dataset.i,1); render(); };
  });
}

const fmtCtx=n=>{
  if(!n) return '—';
  if(n<1e6) return Math.round(n/1000)+'k';
  return (n/1e6).toFixed(2).replace(/\.?0+$/,'')+'M';
};

// Table columns, one spec each. `v` is the sortable value (null always sinks to the
// bottom whichever way we sort); `f` is what the cell shows; `dir` is the direction a
// FIRST click applies — money and latency read best cheapest-first, scores fastest-first.
const COLS=[
  {h:()=>'Model', v:m=>m.name.toLowerCase(), f:m=>m.name, dir:1},
  {h:()=>$('#metric').selectedOptions[0].text, v:(m,k)=>m[k], f:(m,k)=>m[k]??'—', dir:-1, good:'higher'},
  {h:()=>'In $/M',      v:m=>m.pin,  f:m=>'$'+m.pin.toFixed(2),  dir:1, good:'lower'},
  {h:()=>'Out $/M',     v:m=>m.pout, f:m=>'$'+m.pout.toFixed(2), dir:1, good:'lower'},
  {h:()=>'Blended $/M', v:m=>m.b,    f:m=>'$'+m.b.toFixed(2),    dir:1, good:'lower'},
  // Cost per index point — the table's version of "how far right of the frontier is this".
  // Lower is better. Free models are a true 0, not a divide-by-zero; a zero or missing
  // score has no meaningful ratio, so it shows an em dash rather than Infinity.
  {h:()=>'$/M per point', v:(m,k)=>m[k]>0?m.b/m[k]:null,
                          f:(m,k)=>m[k]>0?(m.b/m[k]).toFixed(3):'—', dir:1, good:'lower'},
  {h:()=>'First token', v:m=>m.lat, f:m=>m.lat!=null?(m.lat/1000).toFixed(2)+'s':'—', dir:1, good:'lower'},
  {h:()=>'Tok/s',       v:m=>m.tps, f:m=>m.tps??'—',            dir:-1, good:'higher'},
  {h:()=>'Vision',      v:m=>m.vision?1:0, f:m=>m.vision?'yes':'no', dir:-1},
  {h:()=>'Context',     v:m=>m.ctx, f:m=>fmtCtx(m.ctx), dir:-1, good:'higher'},
];
// 1 = ascending, -1 = descending. Kept outside render() so the reader's chosen sort
// survives a filter change instead of snapping back to the default every keystroke.
let sortCol=1, sortDir=-1;

function renderTable(rows,key,meta){
  const col=COLS[sortCol];
  const sorted=[...rows].sort((a,b)=>{
    const x=col.v(a,key), y=col.v(b,key);
    if(x==null&&y==null) return 0;
    if(x==null) return 1;
    if(y==null) return -1;
    return (x<y?-1:x>y?1:0)*sortDir;
  });
  const head=COLS.map((c,i)=>{
    const on=i===sortCol;
    return `<th data-i="${i}" tabindex="0" role="button" class="${on?'sorted':''}"
      aria-sort="${on?(sortDir===1?'ascending':'descending'):'none'}" title="${c.good?`${c.h()} — ${c.good} is better. Click to sort`:`Click to sort by ${c.h()}`}"
      >${c.h()}<span class="arrow${on?'':' idle'}">${on?(sortDir===1?'▲':'▼'):'↕'}</span></th>`;
  }).join('');
  const body=sorted.map(m=>`<tr data-id="${m.id}">`+COLS.map(c=>`<td>${c.f(m,key)}</td>`).join('')+'</tr>').join('');
  // The toolbar count sits far above the rows, so a lasso or dropdown could reshape the
  // table with no confirmation anywhere near it. This caption is that confirmation.
  const caption = meta.active.length
    ? `Showing <b>${rows.length}</b> of ${meta.total} models — ${meta.active.join(' + ')}`
    : `All ${meta.total} models`;
  $('#tablewrap').innerHTML=`<div class="tcap">${caption}</div>
    <div style="overflow-x:auto"><table><thead><tr>${head}</tr></thead>
    <tbody>${body}</tbody></table></div>`;
  $('#tablewrap').querySelectorAll('th').forEach(th=>{
    const sortBy=()=>{
      const i=+th.dataset.i;
      // Re-clicking the active column flips it; a new column starts in its natural direction.
      if(i===sortCol) sortDir=-sortDir; else { sortCol=i; sortDir=COLS[i].dir; }
      renderTable(rows,key,meta);
    };
    th.onclick=sortBy;
    th.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); sortBy(); } };
  });
}

function render(){
  const key=$('#metric').value, prov=$('#prov').value, oss=$('#oss').value;
  const terms=activeTerms();
  const asof=cutoff(), atEnd=!STOPS.length||+$('#asof').value===STOPS.length-1;
  const scored=MODELS.filter(m=>m[key]!=null);
  const all=scored.filter(m=>m.t<=asof);
  const front=pareto(all.slice(),key);
  const frontIds=new Set(front.map(f=>f.id));
  const ys=scored.map(m=>m[key]);
  // Before data arrives there is nothing to take a min/max of. Fall back to the range the
  // real scores occupy so the axes are drawn at their final scale and nothing jumps when
  // the dots land. (Math.min(...[]) is Infinity, which would poison every coordinate.)
  const y0 = ys.length ? Math.floor(Math.min(...ys)/5)*5 : 5;
  const y1 = ys.length ? Math.ceil(Math.max(...ys)/5)*5 : 65;
  const X=v=>M.l+(lx(v)-lx(XMIN))/(lx(XMAX)-lx(XMIN))*(W-M.l-M.r);
  const Y=v=>H-M.b-(v-y0)/(y1-y0)*(H-M.t-M.b);

  const match=m=>(!prov||m.prov===prov)
    &&(!oss||String(m.oss?1:0)===oss)
    &&(!terms.length||terms.some(t=>m.name.toLowerCase().includes(t)||m.id.toLowerCase().includes(t)))
    &&(!brush||inBrush(X(m.b),Y(m[key])));
  const rows=all.filter(match);
  const filtering=!!(prov||terms.length||oss||brush);

  // Axes stay pinned to the full dataset so the frontier visibly grows into the space
  // instead of the chart rescaling under it every step.
  let g='';
  // Everything that lives inside the left margin is collected separately as well, so the
  // pinned axis pane can redraw the identical marks at the identical coordinates.
  let yMarks='';
  for(let v=y0;v<=y1;v+=5){
    g+=`<line x1="${M.l}" x2="${W-M.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
    yMarks+=`<text class="tick" x="${M.l-9}" y="${Y(v)+4}" text-anchor="end">${v}</text>`;
  }
  g+=yMarks;
  // Gridlines double: every line to the right is exactly 2x the price of the one before it.
  const priceTicks=[[FREE_X,'free']];
  for(let e=-4;e<=5;e++){
    const v=Math.pow(2,e);
    priceTicks.push([v, v<1 ? '$'+v.toFixed(2) : '$'+v]);
  }
  priceTicks.forEach(([v,l])=>{
    g+=`<line x1="${X(v)}" x2="${X(v)}" y1="${M.t}" y2="${H-M.b}" stroke="var(--grid)" stroke-width="1" ${v===FREE_X?'stroke-dasharray="3 3"':''}/>`;
    g+=`<text class="tick" x="${X(v)}" y="${H-M.b+18}" text-anchor="middle">${l}</text>`;
  });
  g+=`<line x1="${M.l}" x2="${W-M.r}" y1="${H-M.b}" y2="${H-M.b}" stroke="var(--axis)" stroke-width="1"/>`;
  g+=`<text class="axlabel" x="${M.l+(W-M.l-M.r)/2}" y="${H-12}" text-anchor="middle">Blended price (3 in : 1 out), $ per million tokens — price doubles each vertical line</text>`;
  const yTitle=`<text class="axlabel" transform="translate(16,${M.t+(H-M.t-M.b)/2}) rotate(-90)" text-anchor="middle">${$('#metric').selectedOptions[0].text}</text>`;
  g+=yTitle;
  yMarks+=yTitle;

  // Ghost frontiers roughly every six months before the current cutoff — the trail the
  // frontier left. Spaced by DATE, not by stop index: the recent window steps weekly, so
  // "every 6th stop" would crowd six dashed lines into the last month and a half.
  const GHOST_GAP = 182*DAY;
  let lastGhost = 0;
  for(let k=0;k<+$('#asof').value;k++){
    const mth=STOPS[k];
    if(mth.end-lastGhost < GHOST_GAP) continue;
    lastGhost = mth.end;
    const past=pareto(scored.filter(m=>m.t<=mth.end),key);
    if(past.length<2) continue;
    g+=`<polyline fill="none" stroke="var(--frontier)" stroke-width="1.5" stroke-linejoin="round"
        stroke-dasharray="4 4" opacity="0.3" points="${past.map(f=>X(f.b)+','+Y(f[key])).join(' ')}"/>`;
    const tip=past[past.length-1];
    g+=`<text class="ghostlabel" x="${X(tip.b)+8}" y="${Y(tip[key])+3.5}">${mth.short}</text>`;
  }
  g+=`<polyline fill="none" stroke="var(--frontier)" stroke-width="2" stroke-linejoin="round"
      points="${front.map(f=>X(f.b)+','+Y(f[key])).join(' ')}" opacity="${filtering?0.3:1}"/>`;

  const mark=m=>{
    // The frontier is identified by its connecting line and direct labels, not by the mark.
    const fill=tpsFill(m);
    const dim=filtering&&!match(m);
    const x=X(m.b), y=Y(m[key]), r=rOf(m), o=dim?0.1:0.92;
    if(m.vision) return `<circle class="pt" data-id="${m.id}" cx="${x}" cy="${y}" r="${r}"
      fill="${fill}" stroke="var(--surface-1)" stroke-width="2" opacity="${o}"/>`;
    const d=r*0.8, sw=Math.max(1.8,r*0.36);
    const X1=`M${x-d} ${y-d}L${x+d} ${y+d}M${x+d} ${y-d}L${x-d} ${y+d}`;
    return `<g class="pt" data-id="${m.id}" opacity="${o}">
      <path d="${X1}" stroke="var(--surface-1)" stroke-width="${sw+3}" stroke-linecap="round"/>
      <path d="${X1}" stroke="${fill}" stroke-width="${sw}" stroke-linecap="round"/></g>`;
  };
  g+=all.filter(m=>!frontIds.has(m.id)).sort((a,b)=>rOf(b)-rOf(a)).map(mark).join('');
  g+=all.filter(m=>frontIds.has(m.id)).map(mark).join('');

  // Label the frontier by default; once a filter narrows things down, label what survived
  // instead — that's what the reader is looking at. Never label all 100 at once.
  // While filtering, every surviving model gets a label — that IS the answer to the query.
  const labelSet = filtering ? rows : front;
  {
    // Only other LABELS reserve space. Dots block a much smaller box (checked separately),
    // otherwise a cluster of frontier dots shoves its own labels far down the plot.
    const placed=[];
    const dots=labelSet.map(f=>({x:X(f.b),y:Y(f[key]),r:rOf(f)}));
    labelSet.forEach((f,i)=>{
      const px=X(f.b), py=Y(f[key]);
      const anchor = px<M.l+70 ? 'start' : (px>W-150 ? 'end' : 'middle');
      // Try above/below at growing offsets; take the first slot that clears every
      // already-placed label and dot, and never leave the plot area.
      const up=rOf(f)+8, down=rOf(f)+16;
      const cands=[];
      for(let k=0;k<20;k++){ cands.push(py-up-k*12); cands.push(py+down+k*12); }
      // Tighter horizontal window when many labels are on screen, or a crowded filter
      // (e.g. all 15 qwen models) would push the last few clean off the plot.
      const winX = labelSet.length>10 ? 74 : 100;
      const clear=ly=> !placed.some(p=>Math.abs(p.x-px)<winX && Math.abs(p.y-ly)<12)
                    && !dots.some(d=>Math.abs(d.x-px)<52 && Math.abs(d.y-ly)<d.r+4);
      // Nearest slot wins, so a label never drifts further from its dot than it has to.
      const free=cands.filter(ly=>ly>M.t+8 && ly<H-M.b-4 && clear(ly))
        .sort((a,b)=>Math.abs(a-py)-Math.abs(b-py))[0];
      const ly = free ?? py-up;
      placed.push({x:px,y:ly});
      const ax = anchor==='start'?px-9:(anchor==='end'?px+9:px);
      // When crowding pushes a label off its mark, draw a hairline so ownership is unambiguous.
      const gap = ly<py ? py-rOf(f)-ly-4 : ly-py-rOf(f)-11;
      if(gap>6){
        const y1 = ly<py ? py-rOf(f)-2 : py+rOf(f)+2;
        const y2 = ly<py ? ly+3 : ly-9;
        g+=`<line x1="${px}" x2="${px}" y1="${y1}" y2="${y2}" stroke="var(--axis)" stroke-width="1"/>`;
      }
      g+=`<text class="dotlabel" x="${ax}" y="${ly}" text-anchor="${anchor}">${shortName(f.name)}</text>`;
    });
  }

  if(brush){
    g += `<path d="${lassoPath(brush)}" fill="var(--frontier)" fill-opacity="0.06"
      stroke="var(--frontier)" stroke-width="1" stroke-dasharray="4 3"/>`;
  }

  // Draw the chart whenever anything is listed by this date, even if the filter matches
  // nothing — every dot dims and the reader keeps the axes, the frontier, and a view of
  // where their search would land. Replacing the whole plot with a sentence threw all of
  // that away. The bare message is only for a date so early that no model exists yet.
  // The axes, gridlines and labels are drawn in every state — loading, error, empty filter.
  // Swapping the plot out for a sentence collapses the card, moves everything below it, and
  // throws away the context that tells the reader where the missing dots would have gone.
  if(statusMsg){
    g += `<text class="statusmsg" x="${M.l+(W-M.l-M.r)/2}" y="${M.t+(H-M.t-M.b)/2}"
      text-anchor="middle">${statusMsg}</text>`;
  }
  const noMatch = !statusMsg && all.length && !rows.length;
  $('#plot').innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Price versus ${$('#metric').selectedOptions[0].text.toLowerCase()} for ${all.length} models">${g}</svg>`
    + (noMatch ? `<div class="nomatch">Nothing listed by ${STOPS[+$('#asof').value].label} matches ${terms.map(t=>`“${t}”`).join(' or ')} — try a later month.</div>` : '');
  $('#yaxis').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${yMarks}</svg>`;
  syncYAxis();

  // A rewound timeline has to keep announcing itself. The old wording only mentioned the
  // date when nothing else was filtered, so "3 of 74 shown" silently hid the fact that the
  // missing models simply weren't listed yet.
  const stop=STOPS[+$('#asof').value];
  const asofLabel=stop?stop.label:'';
  const asofNote = atEnd ? '' : ` · ${all.length} of ${scored.length} listed by ${asofLabel}`;
  $('#count').textContent = (filtering
    ? `${rows.length} of ${all.length} ${brush&&!terms.length&&!prov?'selected':'shown'}`
    : `${all.length} models`) + asofNote;

  // Name each active filter so the table caption can spell out why rows disappeared.
  const active=[];
  if(terms.length) active.push('matching '+terms.map(t=>`“${t}”`).join(' or '));
  if(prov) active.push(prov);
  if(oss) active.push(oss==='1'?'open weights':'closed weights');
  if(brush) active.push('lasso selection');
  if(!atEnd) active.push(`listed by ${asofLabel}`);
  renderTable(rows,key,{total:all.length,active});
  renderChips();

  bindTips();
  bindBrush();
}

// The pinned axis has to sit exactly on top of the real one, at the same scale. The chart
// svg carries a min-width, so on a narrow screen it renders WIDER than its container and a
// percentage-based overlay would land in the wrong place — measure the svg instead.
function syncYAxis(){
  const svg=document.querySelector('svg.chart'), pane=$('#yaxis'), inner=pane.firstElementChild;
  if(!svg||!inner) return;
  const w=svg.getBoundingClientRect().width;
  if(!w) return;
  inner.setAttribute('width',w);
  inner.setAttribute('height',w*H/W);
  pane.style.width=(w*M.l/W)+'px';
  pane.style.height=(w*H/W)+'px';
}
// The shadow only appears once something has actually scrolled under the axis; at rest the
// pane is invisible because it matches the axis it covers.
$('#plot').addEventListener('scroll',()=>{
  $('#yaxis').classList.toggle('floating',$('#plot').scrollLeft>0);
});
addEventListener('resize',syncYAxis);

// Pointer events are taken on the <svg>, so a drag that starts on top of a dot still
// brushes instead of being swallowed by the mark.
function bindBrush(){
  const svg=document.querySelector('svg.chart');
  if(!svg) return;
  svg.style.cursor = selecting ? 'crosshair' : 'default';
  const toView=e=>{
    const r=svg.getBoundingClientRect();
    return {x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H};
  };
  let start=null, live=null, trail=null;
  const NS='http://www.w3.org/2000/svg';
  svg.addEventListener('pointerdown',e=>{
    if(e.button!==0||!selecting) return;
    start=toView(e);
    // Capture keeps the drag alive if the pointer leaves the svg; harmless if it fails.
    try{ svg.setPointerCapture(e.pointerId); }catch{}
    $('#tip').style.opacity=0;
    trail=[[start.x,start.y]];
    live=document.createElementNS(NS,'path');
    live.setAttribute('fill','var(--frontier)'); live.setAttribute('fill-opacity','0.06');
    live.setAttribute('stroke','var(--frontier)'); live.setAttribute('stroke-width','1');
    live.setAttribute('stroke-dasharray','4 3'); live.setAttribute('pointer-events','none');
    svg.appendChild(live);
  });
  svg.addEventListener('pointermove',e=>{
    if(!start||!live) return;
    const p=toView(e);
    // Thin the trail: sub-3px moves add nothing to the shape and just cost points.
    const last=trail[trail.length-1];
    if(Math.hypot(p.x-last[0],p.y-last[1])<3) return;
    trail.push([p.x,p.y]);
    live.setAttribute('d',lassoPath(trail));
  });
  svg.addEventListener('pointerup',()=>{
    if(!start) return;
    // A plain click (no real drag) clears whatever selection was there.
    brush = trail.length<4 ? null : trail;
    start=null; live=null; trail=null;
    syncClear(); render();
  });
}

function syncClear(){
  $('#clear').classList.toggle('hide',!brush);
}
function syncMode(){
  $('#mode').classList.toggle('on',selecting);
  $('#mode').setAttribute('aria-pressed',String(selecting));
}

// The tooltip opens on mouseenter and closes on mouseleave, which is fine with a mouse and
// broken with a finger: a tap fires mouseenter but mouseleave never comes, so the card sits
// there with no way to dismiss it. These two close it the way any popover is expected to —
// tap anywhere off a mark, or scroll. Bound once on the document, not per-render, because
// the marks are replaced on every redraw and the outside is not.
// Capture phase, so tapping a DIFFERENT mark still closes this card before that mark's own
// mouseenter reopens it with the new model.
const hideTip=()=>{ $('#tip').style.opacity=0; };
addEventListener('pointerdown',e=>{ if(!e.target.closest('.pt')) hideTip(); },true);
// The tip is position:fixed, so any scroll leaves it stranded away from its dot.
addEventListener('scroll',hideTip,true);

function bindTips(){
  const tip=$('#tip');
  document.querySelectorAll('.pt').forEach(el=>{
    el.addEventListener('mouseenter',()=>{
      const m=MODELS.find(x=>x.id===el.dataset.id);
      tip.innerHTML=`<b>${m.name}</b><span>${m.id}</span><br>
        <span>Intelligence</span> ${m.i??'—'} · <span>Coding</span> ${m.c??'—'} · <span>Agentic</span> ${m.a??'—'}<br>
        <span>In</span> $${m.pin.toFixed(2)}/M · <span>Out</span> $${m.pout.toFixed(2)}/M · <span>blended</span> $${m.b.toFixed(2)}/M<br>
        <span>First token</span> ${m.lat!=null?(m.lat/1000).toFixed(2)+'s':'—'} · <span>${m.tps??'—'} tok/s</span><br>
        <span>Input</span> ${m.vision?'text + images':'text only'}${m._p?' · <b style="display:inline;color:var(--frontier)">on frontier</b>':''}
        ${selecting?'':`<br><span>Click to ${terms.includes(termFor(m))?'remove from':'add to'} the filter</span>`}`;
      tip.style.opacity=1;
    });
    el.addEventListener('mousemove',e=>{
      tip.style.left=Math.min(e.clientX+14,innerWidth-300)+'px';
      tip.style.top=Math.min(e.clientY+14,innerHeight-140)+'px';
    });
    el.addEventListener('mouseleave',()=>tip.style.opacity=0);
    // Lasso mode owns the pointer while it is armed, so clicks must not also add terms.
    el.style.cursor = selecting ? 'crosshair' : 'pointer';
    el.addEventListener('click',()=>{ if(!selecting) toggleTermForModel(el.dataset.id); });
  });
}

function stamp(){
  const stop=STOPS[+$('#asof').value];
  if(!stop) return;
  $('#asofLabel').textContent=stop.label;
}
$('#asof').oninput=()=>{stamp();render();};

// Play walks the slider forward a month at a time; pressing it at the end rewinds first.
let timer=null;
$('#play').onclick=()=>{
  if(timer){ clearInterval(timer); timer=null; $('#play').textContent='▶ Play'; return; }
  if(+$('#asof').value>=STOPS.length-1) $('#asof').value=0;
  $('#play').textContent='❚❚ Pause';
  stamp(); render();
  timer=setInterval(()=>{
    const v=+$('#asof').value;
    if(v>=STOPS.length-1){ clearInterval(timer); timer=null; $('#play').textContent='▶ Play'; return; }
    $('#asof').value=v+1; stamp(); render();
  },550);
};

// Drag-to-select is armed by this switch, so an accidental drag never eats a click.
$('#mode').onclick=()=>{
  selecting=!selecting;
  brush=null; syncMode(); syncClear(); render();
};
$('#clear').onclick=()=>{ brush=null; syncClear(); render(); };
addEventListener('keydown',e=>{ if(e.key==='Escape'&&brush){ brush=null; syncClear(); render(); } });

$('#prov').onchange=render; $('#metric').onchange=render; $('#oss').onchange=render;
$('#q').oninput=render;
$('#q').onkeydown=e=>{
  if(e.key==='Enter'||e.key===','){ e.preventDefault(); addTerm(); }
  else if(e.key==='Backspace' && !$('#q').value && terms.length){ terms.pop(); render(); }
};
$('#toggle').onclick=()=>{
  const showing=$('#tablewrap').classList.toggle('hide')===false;
  $('#plot').classList.toggle('hide',showing);
  $('#yaxis').classList.toggle('hide',showing);
  $('#toggle').textContent=showing?'Show chart':'Show table';
  if(!showing) syncYAxis();   // the pane cannot be measured while the plot is display:none
};
function boot(){
  initProviders();
  initStops();
  stamp();
  render();
}

function showStatus(msg){
  statusMsg = msg;
  boot();
}

showStatus('Loading models…');
fetch('/api/models')
  .then(r => r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))
  .then(data => {
    if(!Array.isArray(data) || !data.length) throw new Error('empty response');
    MODELS = data;
    statusMsg = null;
    boot();
    $('#freshness').textContent = 'live, cached up to an hour';
  })
  .catch(err => {
    // Say what broke rather than showing an empty chart that looks like "no models match".
    showStatus(`Could not load model data — ${err.message}. Reload to try again.`);
    $('#freshness').textContent = 'unavailable';
  });
</script>

</body>
</html>
